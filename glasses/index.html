<title>Rear Radar</title>
<meta name="description" content="Rear radar for Meta Ray-Ban Display: shows who is coming up behind you, from the jacket's radar.">
<!-- Identify this web app as Meta Ray-Ban Display compatible -->
<meta name="mrbd-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<!--
  Rear Radar on Meta Ray-Ban Display (a Web App: plain HTML, CSS and JavaScript).
  The display is 600 x 600 and additive: black pixels add no light, so black is see-through and
  everything else floats over the street. That's why it stays almost empty until something
  comes up behind you, and why nothing here is a big bright fill.

  Controls (the Neural Band or the touchpad send these as keys; the simulator's buttons too):
    Left / Right   switch view: Alert, Radar, Steps
    Up / Down      brighter / dimmer
    Select (Enter) connect to the jacket over Bluetooth where the browser can (desktop Chrome),
                   otherwise start or stop the demo

  Where the radar comes from, first one that works:
    1. live.html open in another tab of the same Chrome, connected to the jacket (or playing its
       demo): every reading is passed here. This is how to see it live in the simulator.
    2. Bluetooth straight from this page (desktop Chrome only; the glasses have no Web Bluetooth)
    3. the built-in demo: 40 s recorded from the firmware's tracking, looping, after 3 s with nothing else
  On the glasses themselves only the demo works for now: live data there needs a relay from the
  phone (the next step), because the jacket talks Bluetooth to the phone, not to the glasses.

  To try it: Chrome > install "Meta Ray-Ban Display Simulator" from the Chrome Web Store > open
  this page > click the extension's icon to turn the simulator on.
  On the glasses: Meta AI app > App Settings > Apps > Web Apps > Connect Web App > this page's
  https address > Save (Developer Mode on first).
-->

<script>
const $=id=>document.getElementById(id);
function setText(id,t){const e=$(id);if(e&&e.textContent!==t)e.textContent=t;}
// ---------- Journey (firmware v8.3): where your steps took you, and what came up behind you ----------
// The jacket adds up your steps and turns from its IMU (no GPS), so the shape is right but the
// direction drifts a little over time: a sketch of the route, not a map. Everything is kept in
// the jacket's journey frame: x = right of the way you faced at the start, y = ahead of it, metres.
function parseJourney(dv,o){            // the 13-byte journey block after the targets, or null (older firmware)
 if(dv.byteLength<o+13||dv.getUint8(o)!==0xE1)return null;
 const f=dv.getUint8(o+12);
 return {x:dv.getInt16(o+1,true)/10,y:dv.getInt16(o+3,true)/10,h:dv.getUint16(o+5,true)/10,
  steps:dv.getUint16(o+7,true),t:dv.getUint16(o+9,true),id:dv.getUint8(o+11),out:f&1,hk:(f>>1)&1};
}
// Where a target is on the journey map: wearer at (j.x, j.y) facing j.h; target tx to your right, ty behind you
function toWorld(j,tx,ty){const a=j.h*Math.PI/180,s=Math.sin(a),c=Math.cos(a);return [j.x+tx*c-ty*s,j.y-tx*s-ty*c];}

function makeJourney(storeKey){
 const J={id:null,pts:[],seen:[],alerts:[],tick:{t:-1,at:0},seenAt:{},lvl:0,cur:null,savedAt:0,key:storeKey||null,demo:null};
 J.reset=function(id){J.id=id;J.pts=[];J.seen=[];J.alerts=[];J.tick={t:-1,at:0};J.seenAt={};J.lvl=0;J.cur=null;J.save(true);};
 J.save=function(force){
  if(!J.key||J.id===null)return;const t=Date.now();if(!force&&t-J.savedAt<5000)return;J.savedAt=t;
  try{localStorage.setItem(J.key,JSON.stringify({id:J.id,pts:J.pts,seen:J.seen,alerts:J.alerts}));}catch(e){}
 };
 J.load=function(id){
  if(!J.key)return false;
  try{const s=JSON.parse(localStorage.getItem(J.key)||'null');
   if(s&&s.id===id&&Array.isArray(s.pts)){J.id=id;J.pts=s.pts;J.seen=s.seen||[];J.alerts=s.alerts||[];return true;}}catch(e){}
  return false;
 };
 const thin=a=>{const keep=a.length>>1,out=[];for(let i=0;i<keep;i+=2)out.push(a[i]);return out.concat(a.slice(keep));};
 // Call with every reading. Returns true when the picture changed.
 J.add=function(d){
  const j=d&&d.j;if(!j)return false;
  const now=Date.now();
  if(J.id!==j.id&&!(J.id===null&&J.load(j.id)))J.reset(j.id);
  if(j.t!==J.tick.t)J.tick={t:j.t,at:now};
  const tj=j.t+Math.min(0.99,(now-J.tick.at)/1000);   // the jacket sends whole seconds: add the fraction
  let last=J.pts[J.pts.length-1];
  if(last&&tj+3<last.t){J.reset(j.id);last=null;}    // went back in time: the jacket restarted
  let changed=false;
  if(!last||Math.hypot(j.x-last.x,j.y-last.y)>=0.25||tj-last.t>=3){
   J.pts.push({t:+tj.toFixed(2),x:j.x,y:j.y,h:j.h});changed=true;
   if(J.pts.length>8000)J.pts=thin(J.pts);
  }
  // things moving behind you (moving with you, or closing in), twice a second each at most
  for(const t of d.t){
   if(t.lost||(t.c!==2&&t.c!==3))continue;
   const k=t.id,prev=J.seenAt[k];if(prev!==undefined&&tj-prev<0.5&&tj>=prev)continue;
   J.seenAt[k]=tj;const w=toWorld(j,t.x,t.y);
   J.seen.push({t:+tj.toFixed(2),x:+w[0].toFixed(2),y:+w[1].toFixed(2),c:t.c,id:k,r:+t.r.toFixed(1)});changed=true;
   if(J.seen.length>6000)J.seen=thin(J.seen);
  }
  // alerts: one entry per episode, raised if it gets worse, with the closest it came
  if(d.lvl>0){
   const br=d.brg*Math.PI/180,w=toWorld(j,d.ar*Math.sin(br),d.ar*Math.cos(br));
   if(J.cur&&tj-J.cur.end<3){
    const c=J.cur;c.end=+tj.toFixed(2);if(d.ar<c.minR)c.minR=d.ar;
    if(d.lvl>c.lvl){c.lvl=d.lvl;c.wx=+w[0].toFixed(2);c.wy=+w[1].toFixed(2);}
   }else{
    J.cur={t:+tj.toFixed(2),end:+tj.toFixed(2),x:j.x,y:j.y,wx:+w[0].toFixed(2),wy:+w[1].toFixed(2),lvl:d.lvl,r:d.ar,minR:d.ar,brg:d.brg};
    J.alerts.push(J.cur);if(J.alerts.length>400)J.alerts.shift();
   }
   changed=true;
  }
  J.lvl=d.lvl;
  if(changed)J.save(false);
  return changed;
 };
 J.length=function(){let m=0;for(let i=1;i<J.pts.length;i++)m+=Math.hypot(J.pts[i].x-J.pts[i-1].x,J.pts[i].y-J.pts[i-1].y);return m;};
 return J;
}

// The demo is 40 s on a loop: carry the route on from where the last loop ended, so it keeps going
function makeDemoLoop(){
 const L={n:0,x:0,y:0,h:0,t:0,steps:0,end:null};
 L.apply=function(d){
  if(!d||!d.j)return d;
  const j=d.j,a=L.h*Math.PI/180,s=Math.sin(a),c=Math.cos(a);
  d.j=Object.assign({},j,{x:L.x+j.x*c+j.y*s,y:L.y-j.x*s+j.y*c,h:(j.h+L.h)%360,t:j.t+L.t,steps:j.steps+L.steps});
  L.end=d.j;return d;
 };
 L.next=function(){if(!L.end)return;L.n++;L.x=L.end.x;L.y=L.end.y;L.h=L.end.h;L.t=L.end.t+1;L.steps=L.end.steps;};
 L.reset=function(){L.n=0;L.x=L.y=L.h=L.t=L.steps=0;L.end=null;};
 return L;
}

// ---------- Steps and pace (the bar at the bottom). Tap it to switch km / miles ----------
let UNITS=(()=>{try{return localStorage.getItem('rr-units');}catch(e){return null;}})()||(/^en-US/i.test(navigator.language||'')?'mi':'km');
function paceOf(d){
 const j=d&&d.j,steps=j?j.steps:(d?d.steps:0),sl=d?d.sl:0.7,spm=d?d.spm:0;
 const v=spm>0?spm/60*sl:0,dist=steps*sl,secs=j?j.t:null;
 return {steps:steps,spm:spm,pace:v>0.3?1000/v:null,dist:dist,secs:secs,avg:secs&&dist>=50?secs/(dist/1000):null};
}
function fmtClock(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s/60)%60,ss=s%60;
 return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(ss).padStart(2,'0');}
function fmtPace(sPerKm){if(sPerKm==null||!isFinite(sPerKm)||sPerKm>3600)return '--';return fmtClock(UNITS==='mi'?sPerKm*1.609344:sPerKm);}
function fmtDist(m){const v=UNITS==='mi'?m/1609.344:m/1000;return v<10?v.toFixed(2):v.toFixed(1);}
function renderPace(d){
 const bar=$('pacebar');if(!bar)return;
 bar.hidden=!d;if(!d)return;
 const p=paceOf(d),u=UNITS==='mi'?'mi':'km';
 setText('pbSteps',p.steps.toLocaleString('en-GB'));setText('pbCad',String(p.spm||0));
 setText('pbPace',fmtPace(p.pace));setText('pbPaceU','/'+u+' now');
 setText('pbDist',fmtDist(p.dist));setText('pbDistU',u);
 setText('pbTime',p.secs==null?'--':fmtClock(p.secs));
 setText('pbAvg',p.avg==null?'':'avg '+fmtPace(p.avg)+' /'+u);
}
function bindPace(){const bar=$('pacebar');if(!bar)return;
 bar.onclick=()=>{UNITS=UNITS==='mi'?'km':'mi';try{localStorage.setItem('rr-units',UNITS);}catch(e){}renderPace(window.lastPacket||null);};}

function startDemo(){if(demoT)return;DL.reset();demoI=0;src='demo';
 demoT=setInterval(()=>{got(DL.apply(parsePacket(DEMO_PKTS[demoI])),'demo');demoI=(demoI+1)%DEMO_PKTS.length;if(demoI===0)DL.next();},100);}
function stopDemo(){if(!demoT)return;clearInterval(demoT);demoT=0;}
function got(d,from){if(!d)return;last=d;lastAt=Date.now();src=from;paint();}
// 1. from live.html in another tab
const BC='BroadcastChannel' in window?new BroadcastChannel('rear-radar'):null;
if(BC)BC.onmessage=e=>{const m=e.data||{};
 if(m.type==='pkt'&&m.d){stopDemo();got(m.d,m.demo?'phone demo':'live');}
 else if(m.type==='off'&&src!=='demo'&&src!=='bluetooth'){last=null;src='waiting';paint();}};
// 2. Bluetooth from this page (desktop Chrome)
async function connect(){
 try{dev=await navigator.bluetooth.requestDevice({filters:[{services:[SVC]}]});
  dev.ongattserverdisconnected=()=>{if(src==='bluetooth'){last=null;src='waiting';paint();}};
  const s=await dev.gatt.connect(),svc=await s.getPrimaryService(SVC),ch=await svc.getCharacteristic(STATE);
  ch.oncharacteristicvaluechanged=e=>{const d=parsePacket(e.target.value);if(d){stopDemo();got(d,'bluetooth');}};
  await ch.startNotifications();
 }catch(e){}
}
// 3. the demo, if nothing else turns up
setTimeout(()=>{if(!last)startDemo();},3000);
setInterval(()=>{if(last&&src!=='demo'&&Date.now()-lastAt>2500){last=null;src='no data';paint();}},500);

// ---------- drawing ----------
const cv=$('cv');
function ctx(){const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1,W=Math.round(r.width*dpr),H=Math.round(r.height*dpr);
 if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,r.width,r.height);return [g,r.width,r.height];}
const sideWord=b=>Math.abs(b)<6?'straight behind':Math.abs(b)<25?'behind, '+(b<0?'left':'right'):'on your '+(b<0?'left':'right');
function drawAlert(g,w,h,t){
 const d=last,cx=w/2,cy=h/2,R=Math.min(w,h)*0.43;
 if(!d||!d.ok||!d.lvl){
  // nothing to report: just a faint ring so you know it's running
  g.beginPath();g.arc(cx,cy,R,0,Math.PI*2);g.strokeStyle='rgba(255,255,255,.08)';g.lineWidth=Math.max(1,R*0.012);g.stroke();
  return;
 }
 const col=d.lvl>=3?COL.urgent:d.lvl==2?COL.closing:COL.moving;
 // the glow sits where they are: down is behind you, left is your left
 const th=(180-d.brg)*Math.PI/180,span=(d.lvl>=3?42:d.lvl==2?32:24)*Math.PI/180;
 const a0=th-Math.PI/2-span,a1=th-Math.PI/2+span;
 const pulse=d.lvl>=2?0.65+0.35*Math.sin(t*(d.lvl>=3?12:6)):0.85;
 for(let k=3;k>=1;k--){g.beginPath();g.arc(cx,cy,R,a0,a1);g.strokeStyle=col;g.globalAlpha=pulse*(k==1?1:0.18);
  g.lineWidth=R*(k==1?0.045:0.045+k*0.04);g.lineCap='round';g.stroke();}
 g.globalAlpha=1;g.lineCap='butt';
 if(d.lvl>=3){g.beginPath();g.arc(cx,cy,R,0,Math.PI*2);g.strokeStyle=col;g.globalAlpha=0.25*pulse;g.lineWidth=R*0.02;g.stroke();g.globalAlpha=1;}
}
function drawRadar(g,w,h,t){
 const d=last,cx=w/2,cy=h*0.24,S=Math.min(w,h)*0.58/6;   // you near the top, behind you below
 g.lineWidth=1;
 for(const m of [2,4,6]){g.beginPath();g.arc(cx,cy,m*S,0.12*Math.PI,0.88*Math.PI);g.strokeStyle='rgba(255,255,255,'+(m==6?.32:.18)+')';g.stroke();
  g.fillStyle='rgba(255,255,255,.45)';g.font='600 '+Math.round(Math.min(w,h)*0.03)+'px '+getComputedStyle(document.body).fontFamily;
  g.textAlign='left';g.textBaseline='middle';g.fillText(m+' m',cx+4,cy+m*S-8);}
 for(const a of [-60,0,60]){const r=a*Math.PI/180;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.sin(r)*6*S,cy+Math.cos(r)*6*S);g.strokeStyle='rgba(255,255,255,.10)';g.stroke();}
 // you, facing up (forward)
 g.beginPath();g.moveTo(cx,cy-S*0.55);g.lineTo(cx+S*0.38,cy+S*0.35);g.lineTo(cx,cy+S*0.15);g.lineTo(cx-S*0.38,cy+S*0.35);g.closePath();g.fillStyle=COL.accent;g.fill();
 if(!d)return;
 for(const q of d.t){const col=KIND[q.c];if(!col||q.r>6.5)continue;
  const x=cx+q.x*S,y=cy+q.y*S;
  if(q.c==3&&!q.lost){g.beginPath();g.moveTo(x,y);g.lineTo(cx,cy);g.setLineDash([2,6]);g.strokeStyle=col;g.globalAlpha=.6;g.stroke();g.setLineDash([]);g.globalAlpha=1;
   const ph=(t*0.9)%1;g.beginPath();g.arc(x,y,S*(0.25+0.45*ph),0,Math.PI*2);g.strokeStyle=col;g.globalAlpha=.6*(1-ph);g.lineWidth=2;g.stroke();g.globalAlpha=1;g.lineWidth=1;}
  g.beginPath();g.arc(x,y,S*0.2,0,Math.PI*2);
  if(q.lost){g.strokeStyle=col;g.lineWidth=2;g.stroke();g.lineWidth=1;}else{g.fillStyle=col;g.fill();}
  g.fillStyle='rgba(255,255,255,.75)';g.font='700 '+Math.round(Math.min(w,h)*0.032)+'px '+getComputedStyle(document.body).fontFamily;
  g.textAlign='left';g.textBaseline='middle';g.fillText(q.r.toFixed(1),x+S*0.3,y);}
}
let raf=0;
function paint(){if(!raf)raf=requestAnimationFrame(frame);}
function frame(){
 raf=0;const t=performance.now()/1000,d=last;
 const [g,w,h]=ctx();
 setText('src',src);
 document.querySelectorAll('.dots i').forEach(i=>i.classList.toggle('on',+i.dataset.v===view));
 const alertV=view===0,radarV=view===1,stepsV=view===2,lvl=d&&d.ok?d.lvl:0;
 $('stepsV').hidden=!stepsV;
 $('clear').hidden=!(alertV&&d&&d.ok&&!lvl);
 if(alertV&&d&&!d.ok){$('clear').hidden=false;setText('clearT','No radar data');$('clear').style.color=COL.moving;}
 else{setText('clearT','Clear behind');$('clear').style.color='';}
 ['aWord','aDist','aSide'].forEach(id=>$(id).hidden=!(alertV&&lvl>0));
 if(alertV){drawAlert(g,w,h,t);
  if(lvl>0){const col=lvl>=3?COL.urgent:lvl==2?COL.closing:COL.moving;
   $('aWord').style.color=col;setText('aWord',lvl>=3?'URGENT':lvl==2?'CLOSING IN':'FOLLOWING');
   $('aDist').innerHTML=d.ar.toFixed(1)+'<small>m</small>';setText('aSide',sideWord(d.brg));}}
 if(radarV)drawRadar(g,w,h,t);
 if(stepsV){const p=paceOf(d),u=UNITS==='mi'?'mi':'km';
  setText('sSteps',d?p.steps.toLocaleString('en-GB'):'--');setText('sPace',d?fmtPace(p.pace):'--');setText('sPaceU','/'+u);
  setText('sDist',d?fmtDist(p.dist):'--');setText('sDistU',u);setText('sCad',d?String(p.spm||0):'--');setText('sTime',d&&p.secs!=null?fmtClock(p.secs):'--');}
 // keep animating while something pulses
 if(d&&(lvl>=2||(radarV&&d.t.some(q=>q.c==3&&!q.lost)))&&!matchMedia('(prefers-reduced-motion: reduce)').matches)paint();
}
// ---------- input: arrows and select (Enter), from the Neural Band, the touchpad or the simulator ----------
function showHint(){$('hint').style.opacity=1;clearTimeout(hintT);hintT=setTimeout(()=>{$('hint').style.opacity=0;},5000);}
addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'){view=(view+1)%3;}
 else if(e.key==='ArrowLeft'){view=(view+2)%3;}
 else if(e.key==='ArrowUp'){bright=Math.min(1,bright+0.2);}
 else if(e.key==='ArrowDown'){bright=Math.max(0.4,bright-0.2);}
 else if(e.key==='Enter'||e.key===' '){
  if(navigator.bluetooth&&src!=='bluetooth'&&src!=='live')connect();
  else if(demoT){stopDemo();last=null;src='waiting';}else if(src!=='live'&&src!=='bluetooth')startDemo();}
 else return;
 e.preventDefault();$('stage').style.opacity=bright;showHint();paint();
});
addEventListener('resize',paint);
$('stage').style.opacity=bright;showHint();paint();
</script></body></html>
